services:
  postgres:
    image: postgres:17
    container_name: tourplanner-postgres
    environment:
      POSTGRES_DB: tourplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tourplanner_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tourplanner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tourplanner_postgres_data:
