<header class="nav-shell">
  <nav class="nav-list">
    <a routerLink="/tours" class="nav-brand" aria-label="Tour Planner"> TP </a>

    <div class="nav-center">
      <a routerLink="/tours" class="nav-link" aria-label="Tours">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M5 7.5C5 6.12 6.12 5 7.5 5S10 6.12 10 7.5 8.88 10 7.5 10 5 8.88 5 7.5Z"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M14 16.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5-2.5-1.12-2.5-2.5Z"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M9.2 9.2 15 15"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>

        <span>Tours</span>
      </a>
    </div>

    <div class="nav-profile">
      @if (currentUser()) {
        <div class="nav-user">
          <div class="nav-user__avatar">
            {{ currentUser()!.username.charAt(0) }}
          </div>

          <p class="nav-user__label">Signed in</p>

          <p class="nav-user__name">
            {{ currentUser()!.username }}
          </p>
        </div>
      }

      <button class="nav-exit" type="button" (click)="logout()" aria-label="Logout">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M10 6H7.5A2.5 2.5 0 0 0 5 8.5v7A2.5 2.5 0 0 0 7.5 18H10"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M14 8l4 4-4 4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M18 12H9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>

        <span>Exit</span>
      </button>
    </div>

    <button class="nav-mobile-exit" type="button" (click)="logout()" aria-label="Logout">
      Exit
    </button>
  </nav>
</header>
