<header
  class="fixed inset-x-0 bottom-4 z-50 mx-auto w-[calc(100%-2rem)] max-w-md rounded-[1.75rem] border border-white/10 bg-[#1d1d1f] px-3 py-3 shadow-[0_28px_90px_rgba(29,29,31,0.28)] backdrop-blur-2xl md:bottom-auto md:left-5 md:right-auto md:top-5 md:h-[calc(100dvh-2.5rem)] md:w-28 md:max-w-none md:px-3 md:py-4"
>
  <nav class="flex items-center justify-between gap-2 md:h-full md:flex-col">
    <a
      routerLink="/tours"
      class="flex h-12 min-w-12 items-center justify-center rounded-2xl border border-white/10 bg-white/[0.08] px-3 text-[11px] font-bold tracking-[-0.03em] text-white shadow-[inset_0_1px_0_rgba(255,255,255,0.08)] transition hover:bg-white/[0.12] md:w-full"
      aria-label="Tour Planner"
    >
      TP
    </a>

    <div class="flex items-center gap-2 md:w-full md:flex-col">
      <a
        routerLink="/tours"
        class="group flex h-12 min-w-12 items-center justify-center gap-2 rounded-2xl bg-white px-3 text-[#1d1d1f] shadow-[0_18px_45px_rgba(255,255,255,0.10)] transition hover:-translate-y-0.5 hover:bg-[#f6f4ef] active:translate-y-0 md:w-full md:flex-col md:gap-1"
        aria-label="Tours"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M5 7.5C5 6.12 6.12 5 7.5 5S10 6.12 10 7.5 8.88 10 7.5 10 5 8.88 5 7.5Z"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M14 16.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5-2.5-1.12-2.5-2.5Z"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M9.2 9.2 15 15"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>

        <span class="hidden text-[8px] font-bold uppercase tracking-[0.14em] md:block">
          Tours
        </span>
      </a>
    </div>

    <div class="hidden w-full md:block">
      @if (currentUser()) {
        <div class="mb-3 rounded-2xl border px-2 py-3 text-center">
          <div
            class="mx-auto grid h-9 w-9 place-items-center rounded-xl bg-white/[0.30] text-[11px] font-bold uppercase text-white"
          >
            {{ currentUser()!.username.charAt(0) }}
          </div>

          <p class="mt-2 truncate text-[9px] font-bold uppercase tracking-[0.13em] text-white/42">
            Signed in
          </p>

          <p class="mt-1 truncate capitalize text-[11px] font-semibold tracking-[-0.03em] text-white/82">
            {{ currentUser()!.username }}
          </p>
        </div>
      }

      <button
        class="group flex h-12 w-full items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[0.065] px-3 text-white/58 shadow-[inset_0_1px_0_rgba(255,255,255,0.07)] transition hover:bg-red-500/12 hover:text-red-100 md:flex-col md:gap-1"
        type="button"
        (click)="logout()"
        aria-label="Logout"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M10 6H7.5A2.5 2.5 0 0 0 5 8.5v7A2.5 2.5 0 0 0 7.5 18H10"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M14 8l4 4-4 4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M18 12H9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>

        <span class="text-[8px] font-bold uppercase tracking-[0.12em]"> Exit </span>
      </button>
    </div>

    <button
      class="flex h-12 min-w-12 items-center justify-center rounded-2xl border border-white/10 bg-white/[0.065] px-3 text-[9px] font-bold uppercase tracking-[0.12em] text-white/58 transition hover:bg-red-500/12 hover:text-red-100 md:hidden"
      type="button"
      (click)="logout()"
      aria-label="Logout"
    >
      Exit
    </button>
  </nav>
</header>
